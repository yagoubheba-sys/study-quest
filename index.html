<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Quest - Gamified Study Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>⚔️ Study Quest</h1>
            <div class="user-stats">
                <div class="stat">
                    <span class="stat-label">Level</span>
                    <span class="stat-value" id="levelDisplay">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">XP</span>
                    <span class="stat-value" id="xpDisplay">0/100</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🔥 Streak</span>
                    <span class="stat-value" id="streakDisplay">0</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Level Progress Bar -->
            <div class="level-section">
                <div class="level-bar">
                    <div class="level-progress" id="levelProgress">0%</div>
                </div>
                <p class="level-text">Progress to Level <span id="nextLevel">2</span></p>
            </div>

            <!-- Timer Display -->
            <div class="timer-section">
                <div class="timer-display" id="timerDisplay">
                    <div class="timer-time">02:00:00</div>
                    <div class="timer-label" id="timerLabel">Study Time</div>
                </div>
                <div class="timer-info">
                    <span id="sessionInfo">Session 1 of ∞</span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" id="startBtn">▶ Start Quest</button>
                <button class="btn btn-secondary" id="pauseBtn" disabled>⏸ Pause</button>
                <button class="btn btn-danger" id="resetBtn">🔄 Reset</button>
            </div>

            <!-- Quick Stats -->
            <div class="quick-stats">
                <div class="stat-card">
                    <h3>📚 Study Sessions</h3>
                    <p id="sessionsCompleted">0</p>
                </div>
                <div class="stat-card">
                    <h3>⏱ Total Time</h3>
                    <p id="totalTime">0h 0m</p>
                </div>
                <div class="stat-card">
                    <h3>🎯 Best Streak</h3>
                    <p id="bestStreak">0</p>
                </div>
            </div>

            <!-- Today's Status -->
            <div class="today-section">
                <h2>Today's Status</h2>
                <div class="today-status" id="todayStatus">
                    <p>❌ Not studied today</p>
                </div>
                <button class="btn btn-success" id="checkInBtn">✅ Check In Today</button>
            </div>

            <!-- Achievements -->
            <div class="achievements-section">
                <h2>🏆 Achievements</h2>
                <div class="achievements-grid" id="achievementsGrid">
                    <!-- Achievements will be added here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Session Complete Modal -->
    <div class="modal" id="sessionModal">
        <div class="modal-content">
            <h2>🎉 Session Complete!</h2>
            <p id="xpGained">You earned 100 XP!</p>
            <p id="levelUpMessage"></p>
            <button class="btn btn-primary" id="closeModalBtn">Continue</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
